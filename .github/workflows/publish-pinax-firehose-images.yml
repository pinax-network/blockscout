name: Publish Pinax Firehose images

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feat/firehose-backfill

permissions:
  contents: read
  packages: write

env:
  RELEASE_VERSION: 11.2.4

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: echo "tag=${RELEASE_VERSION}-firehose-${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Blockscout
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=blockscout-arbitrum
          cache-to: type=gha,mode=max,scope=blockscout-arbitrum
          tags: ghcr.io/pinax-network/blockscout:${{ steps.image.outputs.tag }}
          build-args: |
            BLOCKSCOUT_VERSION=v${{ env.RELEASE_VERSION }}.+commit.${{ github.sha }}
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            CHAIN_TYPE=arbitrum

      - name: Build and publish Firehose connector
        uses: docker/build-push-action@v6
        with:
          context: ./dev/firehose
          file: ./dev/firehose/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=blockscout-firehose
          cache-to: type=gha,mode=max,scope=blockscout-firehose
          tags: ghcr.io/pinax-network/blockscout-firehose:${{ steps.image.outputs.tag }}
